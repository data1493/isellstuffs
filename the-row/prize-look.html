<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prizes — The Row</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070806;
      --lime: #d8ff3e;
      --lime-2: #edff9a;
      --ink: #e7f0d4;
      --muted: #9aa58a;
      --paper: #efe6c8;
      --paper-ink: #1b1d14;
      --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1.45;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid rgba(216, 255, 62, 0.28);
    }
    .brand {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.7rem;
      letter-spacing: 0.02em;
      color: var(--lime);
    }
    .look {
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.68rem;
      color: var(--muted);
    }
    main { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; padding: 1.4rem 0 2.5rem; }
    .kicker {
      margin: 0;
      color: var(--lime);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }
    h1, h2 {
      margin: 0.15rem 0 0;
      font-family: var(--display);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      line-height: 0.84;
      color: #f4ffe0;
    }
    h1 { font-size: clamp(4.2rem, 10vw, 7.4rem); }
    h2 { font-size: clamp(2.6rem, 5vw, 3.6rem); }
    .lede { margin: 0.7rem 0 0; max-width: 38rem; color: var(--muted); }
    .win { margin-top: 0.4rem; }
    .stage {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 0.8rem;
      align-items: stretch;
    }
    .panel {
      background: #10140c;
      border: 1px solid rgba(216, 255, 62, 0.28);
      padding: 0.9rem 0.9rem 0.8rem;
    }
    .wave {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 92px;
    }
    .wave i {
      flex: 1;
      display: block;
      background: rgba(216, 255, 62, 0.28);
      min-height: 4px;
    }
    .wave.live i.hot { background: var(--lime); }
    .play {
      margin-top: 0.75rem;
      width: 100%;
      border: none;
      background: var(--lime);
      color: #111408;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.75rem;
      padding: 0.75rem 0.8rem;
    }
    .play.on { background: var(--lime-2); }
    .fine { margin: 0.55rem 0 0; color: var(--muted); font-size: 0.75rem; }
    .meta {
      display: grid;
      align-content: end;
      gap: 0.35rem;
      padding: 0.9rem;
      background: var(--paper);
      color: var(--paper-ink);
      transform: rotate(-0.5deg);
    }
    .meta b {
      font-family: var(--display);
      font-weight: 800;
      font-size: 2.4rem;
      line-height: 0.8;
      text-transform: uppercase;
    }
    .meta span { letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.68rem; color: #5c6b2a; }
    .shelf { margin-top: 1.6rem; }
    .grid {
      margin-top: 0.85rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.7rem;
    }
    .card {
      background: var(--paper);
      color: var(--paper-ink);
      padding: 0.75rem 0.7rem 0.7rem;
      display: grid;
      gap: 0.45rem;
      align-content: start;
    }
    .card.won { outline: 2px solid var(--lime); outline-offset: 3px; }
    .card .kicker { color: #5c6b2a; }
    .card h3 {
      margin: 0;
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.85rem;
      line-height: 0.84;
      text-transform: uppercase;
    }
    .card p { margin: 0; font-size: 0.75rem; color: #3d4a12; }
    .card .wave { height: 54px; }
    .card .wave i { background: rgba(17, 20, 8, 0.18); }
    .card .wave.live i.hot { background: #111408; }
    .card button {
      border: none;
      background: #111408;
      color: var(--paper);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.66rem;
      padding: 0.5rem 0.45rem;
    }
    .card .tag {
      justify-self: start;
      background: var(--lime);
      color: #111408;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.62rem;
      padding: 0.15rem 0.35rem;
    }
    @media (max-width: 800px) {
      .stage, .grid { grid-template-columns: 1fr; }
      .meta { transform: none; }
      h1 { font-size: 3.6rem; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">The Row</a>
    <span class="look">A look</span>
  </header>
  <main>
    <section class="win">
      <p class="kicker">You keep it</p>
      <h1>Bold Condensed.</h1>
      <p class="lede">Eight seconds. It plays when the round is yours. Then it stays on your name.</p>
      <div class="stage">
        <div class="panel">
          <div class="wave" id="winWave" data-id="bold"></div>
          <button class="play" id="winPlay" type="button">Play the bar</button>
          <p class="fine" id="winFine">Won on Pile. First to five.</p>
        </div>
        <div class="meta">
          <span>On the account</span>
          <b>1 bar kept</b>
          <span>Bold Condensed · 8 seconds</span>
        </div>
      </div>
    </section>
    <section class="shelf">
      <p class="kicker">The shelf</p>
      <h2>Your bars.</h2>
      <div class="grid" id="shelf"></div>
    </section>
  </main>
  <script type="module">
    const PRIZES = [
      {
        id: "j190",
        kicker: "File",
        name: "J190.WAV",
        line: "One bar. Night.",
        src: "/audio/j190.wav",
        wave: [18, 86, 14, 22, 10, 78, 16, 12, 20, 90, 12, 16, 74, 14, 18, 12, 88, 16, 20, 10, 70, 14, 18, 22],
      },
      {
        id: "bold",
        kicker: "Font",
        name: "Bold Condensed",
        line: "The versus prize.",
        src: "/audio/bold.wav",
        won: true,
        wave: [92, 28, 74, 22, 90, 30, 70, 24, 94, 26, 76, 20, 88, 32, 72, 22, 96, 28, 78, 24, 90, 30, 74, 26],
      },
      {
        id: "list",
        kicker: "List",
        name: "Drawer 04",
        line: "Tight hats. A short walk.",
        src: "/audio/list.wav",
        wave: [70, 34, 62, 40, 74, 36, 58, 44, 72, 32, 66, 38, 76, 34, 60, 42, 68, 36, 64, 40, 78, 30, 62, 38],
      },
      {
        id: "stub",
        kicker: "Seat",
        name: "Versus seat",
        line: "Lighter. In on the run.",
        src: "/audio/stub.wav",
        wave: [48, 16, 20, 64, 14, 18, 44, 12, 52, 16, 18, 60, 14, 22, 46, 12, 50, 18, 16, 58, 14, 20, 42, 16],
      },
    ];

    const audios = new Map();
    let current = null;

    function paintWave(node, prize) {
      node.replaceChildren();
      for (const height of prize.wave) {
        const bar = document.createElement("i");
        bar.style.height = `${height}%`;
        node.append(bar);
      }
    }

    function mark(id, ratio) {
      for (const wave of document.querySelectorAll(`.wave[data-id="${id}"]`)) {
        const cols = [...wave.querySelectorAll("i")];
        const upto = Math.floor(ratio * cols.length);
        cols.forEach((col, index) => col.classList.toggle("hot", ratio > 0 && index <= upto));
        wave.classList.toggle("live", ratio > 0);
      }
    }

    function stopAll(except) {
      for (const [id, audio] of audios) {
        if (id === except) continue;
        audio.pause();
        mark(id, 0);
      }
      for (const button of document.querySelectorAll("[data-play]")) {
        if (button.dataset.play !== except) button.textContent = button.dataset.label;
        button.classList.toggle("on", button.dataset.play === except);
      }
    }

    function audioFor(prize) {
      let audio = audios.get(prize.id);
      if (!audio) {
        audio = new Audio(prize.src);
        audio.hidden = true;
        document.body.append(audio);
        audio.addEventListener("timeupdate", () => {
          if (!audio.duration) return;
          mark(prize.id, audio.currentTime / audio.duration);
        });
        audio.addEventListener("ended", () => {
          mark(prize.id, 0);
          stopAll("");
          if (current === prize.id) current = null;
        });
        audios.set(prize.id, audio);
      }
      return audio;
    }

    function play(prize) {
      const audio = audioFor(prize);
      if (current === prize.id && !audio.paused) {
        audio.pause();
        mark(prize.id, 0);
        current = null;
        stopAll("");
        return;
      }
      stopAll(prize.id);
      current = prize.id;
      audio.currentTime = 0;
      audio.play().catch(() => {});
      for (const button of document.querySelectorAll(`[data-play="${prize.id}"]`)) {
        button.textContent = "Playing";
        button.classList.add("on");
      }
    }

    const win = PRIZES[1];
    const winWave = document.querySelector("#winWave");
    paintWave(winWave, win);
    document.querySelector("#winPlay").dataset.play = win.id;
    document.querySelector("#winPlay").dataset.label = "Play the bar";
    document.querySelector("#winPlay").addEventListener("click", () => play(win));

    const shelf = document.querySelector("#shelf");
    for (const prize of PRIZES) {
      const card = document.createElement("article");
      card.className = prize.won ? "card won" : "card";
      const kicker = document.createElement("p");
      kicker.className = "kicker";
      kicker.textContent = prize.kicker;
      const title = document.createElement("h3");
      title.textContent = prize.name;
      const line = document.createElement("p");
      line.textContent = prize.line;
      const wave = document.createElement("div");
      wave.className = "wave";
      wave.dataset.id = prize.id;
      paintWave(wave, prize);
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.play = prize.id;
      button.dataset.label = "Play";
      button.textContent = "Play";
      button.addEventListener("click", () => play(prize));
      card.append(kicker, title, line, wave);
      if (prize.won) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "Just won";
        card.append(tag);
      }
      card.append(button);
      shelf.append(card);
    }
  </script>
</body>
</html>
