<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pile — The Row</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070806;
      --lime: #d8ff3e;
      --ink: #e7f0d4;
      --muted: #9aa58a;
      --line: rgba(216, 255, 62, 0.28);
      --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      overflow: hidden;
    }
    button, a { font: inherit; color: inherit; }
    a { text-decoration: none; }
    .top {
      position: absolute;
      z-index: 2;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1rem;
    }
    .mark {
      font-family: var(--display);
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--lime);
      font-size: 1.3rem;
    }
    .rule {
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }
    .top .spacer { flex: 1; }
    .back {
      border: 1px solid var(--lime);
      color: var(--lime);
      padding: 0.45rem 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }
    .board {
      height: 100svh;
      display: grid;
      grid-template-columns: 1fr minmax(240px, 340px) 1fr;
    }
    .side {
      border: 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 0.8rem;
      padding: 5.5rem 1rem 4.5rem;
      min-width: 0;
    }
    .side:hover, .side:focus-visible { background: rgba(216, 255, 62, 0.05); outline: none; }
    .side.hot { background: rgba(216, 255, 62, 0.12); }
    .side.winner { background: rgba(216, 255, 62, 0.16); }
    .count {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(5rem, 14vw, 9rem);
      line-height: 0.8;
      color: #f4ffe0;
    }
    .who {
      font-family: var(--display);
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--lime);
    }
    .stack {
      display: flex;
      flex-direction: column-reverse;
      gap: 0.35rem;
      width: min(180px, 80%);
      min-height: 8rem;
    }
    .chip {
      border: 1px solid var(--lime);
      color: var(--lime);
      text-align: center;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.72rem;
      padding: 0.35rem 0.4rem;
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 4.5rem 0.6rem 4rem;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    .prize {
      width: min(220px, 100%);
      background: #efe6c8;
      color: #1b1d14;
      padding: 0.9rem 0.8rem 1rem;
      text-align: center;
      transition: transform 0.35s ease;
    }
    .prize b {
      display: block;
      font-family: var(--display);
      font-size: 2.1rem;
      line-height: 0.9;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }
    .prize span {
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.68rem;
    }
    .prize.to-left { transform: translateX(-28px) rotate(-2deg); }
    .prize.to-right { transform: translateX(28px) rotate(2deg); }
    .tally {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.45rem;
      align-items: center;
      width: 100%;
    }
    .pips { display: flex; gap: 0.28rem; }
    .pips.right { justify-content: flex-end; }
    .pip {
      width: 14px;
      height: 14px;
      border: 1px solid var(--lime);
    }
    .pip.on { background: var(--lime); }
    .vs {
      font-family: var(--display);
      color: var(--lime);
      font-size: 1.4rem;
      letter-spacing: 0.08em;
    }
    .status {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      min-height: 2.6rem;
    }
    .status.won { color: var(--lime); }
    .again {
      border: 0;
      background: var(--lime);
      color: #111408;
      padding: 0.6rem 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .again[hidden] { display: none; }
    .you-stamp { color: var(--lime); letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.72rem; }
    .you-stamp[hidden] { display: none; }
    .board.blocked .side { opacity: 0.38; pointer-events: none; }
    .status.live { color: var(--lime); }
    .hint {
      position: absolute;
      left: 0; right: 0; bottom: 0.8rem;
      text-align: center;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.68rem;
    }
    @media (max-width: 720px) {
      body { overflow: auto; }
      .board {
        height: auto;
        min-height: 100svh;
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "center center"
          "left right";
      }
      .center { grid-area: center; border: 0; border-bottom: 1px solid var(--line); padding-top: 4.2rem; }
      #left { grid-area: left; }
      #right { grid-area: right; }
      .hint { position: static; padding: 0.8rem 1rem 1.2rem; }
      .count { font-size: 4.2rem; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="mark" href="/">The Row</a>
    <span class="rule">Pile · first to 5</span>
    <span class="spacer"></span>
    <span class="you-stamp" id="youStamp" hidden></span>
    <a class="back" href="/">The room</a>
  </header>

  <main class="board">
    <button class="side" id="left" type="button" aria-label="Pile onto Nova">
      <div class="stack" id="leftStack"></div>
      <div class="count" id="leftCount">0</div>
      <div class="who">Nova</div>
    </button>
    <div class="center">
      <div class="prize" id="prize">
        <span>Tonight’s drop</span>
        <b>Bold Condensed</b>
      </div>
      <div class="tally" aria-hidden="true">
        <div class="pips" id="leftPips"></div>
        <div class="vs">VS</div>
        <div class="pips right" id="rightPips"></div>
      </div>
      <p class="status" id="status">Tap a side. First to five keeps the font.</p>
      <button class="again" id="again" type="button" hidden>Run it again</button>
      <button class="again" id="stepOut" type="button" hidden>Step out</button>
      <button class="again" id="lockSeat" type="button" hidden>Lock in</button>
    </div>
    <button class="side" id="right" type="button" aria-label="Pile onto Jun">
      <div class="stack" id="rightStack"></div>
      <div class="count" id="rightCount">0</div>
      <div class="who">Jun</div>
    </button>
  </main>
  <p class="hint">F nova · J jun</p>

  <script type="module">
    import { pileOn, resetPile, pileLine, roundLine, linePlace, seatYou } from "./js/room.mjs?v=6";
    import { readRoom, writeRoom } from "./js/persist.mjs?v=6";
    import { crowdOn, watchCrowd } from "./js/live.mjs?v=6";
    import { stampYou, watchCall } from "./js/gate.mjs?v=6";
    import { awardBar, ensureTagStyle, flashSides, mineSide, paintWho, postRow, reportMove } from "./js/watch.mjs?v=6";

    const leftBtn = document.querySelector("#left");
    const rightBtn = document.querySelector("#right");
    const leftStack = document.querySelector("#leftStack");
    const rightStack = document.querySelector("#rightStack");
    const leftCount = document.querySelector("#leftCount");
    const rightCount = document.querySelector("#rightCount");
    const leftPips = document.querySelector("#leftPips");
    const rightPips = document.querySelector("#rightPips");
    const status = document.querySelector("#status");
    const prize = document.querySelector("#prize");
    const again = document.querySelector("#again");
    const stepOut = document.querySelector("#stepOut");
    const lockSeat = document.querySelector("#lockSeat");
    const storage = localStorage;
    let room = readRoom(storage);
    let seen = null;

    for (let i = 0; i < room.pile.goal; i += 1) {
      leftPips.appendChild(Object.assign(document.createElement("i"), { className: "pip" }));
      rightPips.appendChild(Object.assign(document.createElement("i"), { className: "pip" }));
    }

    function paintSeats() {
      const you = room.you;
      const mine = mineSide(room, you);
      const wonIt = room.pile.status === "won" && mine && room.pile.winner === mine;
      if (crowdOn()) {
        again.hidden = !wonIt;
        again.textContent = "Run it back";
        stepOut.hidden = !wonIt;
        lockSeat.hidden = !you || Boolean(mine) || linePlace(room, you.handle) > 0;
      } else {
        again.hidden = room.pile.status === "open";
        again.textContent = "Run it again";
        stepOut.hidden = true;
        lockSeat.hidden = true;
      }
    }

    function paint() {
      ensureTagStyle();
      const { pile, drop } = room;
      leftCount.textContent = String(pile.leftScore);
      rightCount.textContent = String(pile.rightScore);
      paintWho("left", room);
      paintWho("right", room);
      prize.querySelector("b").textContent = drop.name;
      [...leftPips.children].forEach((pip, i) => pip.classList.toggle("on", i < pile.leftScore));
      [...rightPips.children].forEach((pip, i) => pip.classList.toggle("on", i < pile.rightScore));
      leftStack.replaceChildren();
      rightStack.replaceChildren();
      const leftName = room.seats?.left || "nova";
      const rightName = room.seats?.right || "jun";
      for (let i = 0; i < pile.leftScore; i += 1) leftStack.append(chip(leftName));
      for (let i = 0; i < pile.rightScore; i += 1) rightStack.append(chip(rightName));
      const other = Boolean(pile.game && pile.game !== "pile");
      document.querySelector(".board").classList.toggle("blocked", other);
      if (other) {
        leftCount.textContent = "–";
        rightCount.textContent = "–";
        [...leftPips.children].forEach((pip) => pip.classList.remove("on"));
        [...rightPips.children].forEach((pip) => pip.classList.remove("on"));
        leftStack.replaceChildren();
        rightStack.replaceChildren();
      }
      status.textContent = other
        ? roundLine(room)
        : pile.status !== "open"
          ? pileLine(room)
          : crowdOn() && !mineSide(room, room.you)
            ? "Watching this round."
            : crowdOn()
              ? "Your seat. First to five."
              : `Tap a side. First to five keeps ${drop.name}.`;
      status.classList.toggle("won", pile.status !== "open");
      status.classList.toggle("live", other);
      document.querySelector(".hint").textContent = crowdOn() ? (mineSide(room, room.you) ? "You're in. Tap your side." : "Watching the room") : `F ${leftName} · J ${rightName}`;
      prize.classList.toggle("to-left", pile.winner === "left");
      prize.classList.toggle("to-right", pile.winner === "right");
      leftBtn.classList.toggle("winner", pile.winner === "left");
      rightBtn.classList.toggle("winner", pile.winner === "right");
      paintSeats();
    }

    function chip(name) {
      const node = document.createElement("div");
      node.className = "chip";
      node.textContent = name;
      return node;
    }

    function sit() {
      if (crowdOn()) return;
      const next = seatYou(room);
      if (next === room) return;
      room = next;
      writeRoom(storage, room);
    }

    function commit(next, move) {
      const before = room;
      room = next;
      if (!crowdOn()) {
        sit();
        writeRoom(storage, room);
        if (move) reportMove({ ...move, drop: room.drop?.id });
        awardBar(before, room);
      }
      paint();
    }

    async function push(side) {
      if (room.pile.game && room.pile.game !== "pile") {
        status.textContent = roundLine(room);
        status.classList.add("live");
        return;
      }
      const you = readRoom(storage).you;
      if (crowdOn()) {
        if (mineSide(room, you) !== side) return;
        const btn = side === "left" ? leftBtn : rightBtn;
        btn.classList.add("hot");
        setTimeout(() => btn.classList.remove("hot"), 460);
        await postRow("/act", { handle: you.handle, kind: "pile", side });
        return;
      }
      const result = pileOn(room, side);
      if (!result.ok) return;
      const btn = side === "left" ? leftBtn : rightBtn;
      btn.classList.add("hot");
      setTimeout(() => btn.classList.remove("hot"), 460);
      commit(result.state, { kind: "pile", side });
    }

    leftBtn.addEventListener("click", () => push("left"));
    rightBtn.addEventListener("click", () => push("right"));
    again.addEventListener("click", async () => {
      const you = readRoom(storage).you;
      if (crowdOn()) {
        if (!you) return;
        await postRow("/again", { handle: you.handle, stay: true });
        return;
      }
      commit(resetPile(room).state, { kind: "reset" });
    });
    stepOut.addEventListener("click", async () => {
      const you = readRoom(storage).you;
      if (!you) return;
      await postRow("/again", { handle: you.handle, stay: false });
    });
    lockSeat.addEventListener("click", async () => {
      const you = readRoom(storage).you;
      if (!you) return;
      await postRow("/queue", { handle: you.handle, link: you.link, game: "pile" });
    });
    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (key === "f") push("left");
      if (key === "j") push("right");
    });
    function showYou() {
      stampYou(readRoom(storage).you, room);
    }

    if (!crowdOn() && !readRoom(storage).you) {
      location.replace("/#in");
    } else if (crowdOn()) {
      watchCrowd((next) => {
        if (!next) {
          document.body.classList.remove("crowd");
          if (!readRoom(storage).you) {
            location.replace("/#in");
            return;
          }
          room = readRoom(storage);
          sit();
          showYou();
          paint();
          watchCall({ room, here: "pile", crowd: false, you: room.you });
          window.addEventListener("pageshow", () => {
            if (!readRoom(storage).you) { location.replace("/#in"); return; }
            room = readRoom(storage);
            sit();
            showYou();
            paint();
          });
          return;
        }
        const you = readRoom(storage).you;
        const merged = you ? { ...next, you } : next;
        awardBar(seen, merged);
        flashSides(seen, merged);
        seen = merged;
        room = merged;
        showYou();
        paint();
        watchCall({ room, here: "pile", crowd: true, you });
      });
    } else {
      sit();
      showYou();
      paint();
      watchCall({ room, here: "pile", crowd: false, you: room.you });
      window.addEventListener("pageshow", () => {
        if (!readRoom(storage).you) { location.replace("/#in"); return; }
        room = readRoom(storage);
        sit();
        showYou();
        paint();
      });
    }
  </script>
</body>
</html>
